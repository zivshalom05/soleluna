<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>צרו קשר | sole&luna</title>
  <meta name="description" content="צרו קשר עם sole&luna — מייל, אינסטגרם ושירות לקוחות. נשמח לעזור בכל שאלה על מוצרים, הזמנות ומידות." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://soleluna.co.il/contact.html" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Frank+Ruhl+Libre:wght@500&family=Assistant:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root{--bone:#F4F1EA;--paper:#FBF9F3;--ink:#141A24;--navy:#1E2C4A;--muted:#54607D;--line:rgba(20,26,36,.14);}
    *{box-sizing:border-box;margin:0;} body{font-family:"Assistant",system-ui,sans-serif;background:var(--bone);color:var(--ink);line-height:1.85;font-size:1.06rem;}
    .wrap{max-width:820px;margin-inline:auto;padding:clamp(2rem,5vw,5rem) clamp(1.2rem,4vw,2rem);}
    .home{font-family:"Cormorant Garamond",serif;font-weight:600;letter-spacing:.06em;font-size:1.7rem;color:var(--navy);text-decoration:none;display:inline-block;margin-bottom:2.4rem;}
    h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(2rem,4vw,2.8rem);margin-bottom:.3rem;color:var(--navy);}
    h2{font-family:"Frank Ruhl Libre",serif;font-weight:500;font-size:1.3rem;margin:2rem 0 .6rem;color:var(--navy);}
    p,li{color:#28313f;} a{color:var(--navy);}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:1.2rem 1.4rem;margin:.8rem 0;}
    .card b{font-family:"Frank Ruhl Libre",serif;}
    form{display:grid;gap:.8rem;margin-top:1rem;}
    input,textarea{font-family:inherit;font-size:1rem;border:1px solid var(--line);background:#fff;border-radius:6px;padding:.7em .9em;}
    button{font-family:"Assistant";font-weight:600;background:var(--navy);color:var(--bone);border:0;border-radius:6px;padding:.9em;cursor:pointer;letter-spacing:.06em;}
    footer{border-top:1px solid var(--line);margin-top:3rem;padding-top:1.4rem;font-size:.85rem;color:var(--muted);}
  </style>
</head>
<body>
  <div class="wrap">
    <a class="home" href="index.html">sole&luna</a>
    <h1>צרו קשר</h1>
    <p class="updated" style="color:var(--muted);margin-bottom:1.4rem;">נשמח לעזור — בשאלות על מוצרים, מידות, הזמנות או החזרות.</p>

    <div class="card"><b>מייל:</b> <a href="mailto:solelunabsns@gmail.com">solelunabsns@gmail.com</a></div>
    <div class="card"><b>אינסטגרם:</b> <a href="https://www.instagram.com/solelunaofficiall" target="_blank" rel="noopener">@solelunaofficiall</a></div>
    <div class="card"><b>זמני מענה:</b> א׳–ה׳, 9:00–18:00 · מענה תוך יום עסקים</div>

    <h2>שלחו לנו הודעה</h2>
    <form onsubmit="event.preventDefault(); window.location.href='mailto:solelunabsns@gmail.com?subject='+encodeURIComponent('פנייה מהאתר — '+(this.name.value||''))+'&body='+encodeURIComponent(this.msg.value||'');">
      <input name="name" type="text" placeholder="שם מלא" required />
      <input name="email" type="email" placeholder="אימייל" required />
      <textarea name="msg" rows="4" placeholder="במה נוכל לעזור?" required></textarea>
      <button type="submit">שליחה</button>
    </form>

    <footer><a href="index.html">חזרה לאתר</a> · <a href="faq.html">שאלות נפוצות</a></footer>
  </div>
</body>
</html>
