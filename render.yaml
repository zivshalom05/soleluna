services:
  - type: web
    name: soleluna
    runtime: node
    plan: free
    buildCommand: npm install && npm rebuild
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: ADMIN_PASS
        sync: false
      - key: NODE_ENV
        value: production
      - key: ALLOW_DEMO_CHECKOUT
        value: "true"
      - key: GROW_USER_ID
        sync: false
      - key: GROW_PAGE_CODE
        sync: false
      - key: GROW_API_KEY
        sync: false
      - key: GROW_ENV
        value: sandbox
      # ---- Watchtower monitoring ----
      - key: NOTIFY_EMAIL
        value: solelunabsns@gmail.com
      - key: RESEND_API_KEY
        sync: false
      # secret — set once in Render's dashboard, never committed. Changing
      # this to sync:false does NOT reset the value already configured there.
      - key: CRON_KEY
        sync: false
      - key: REPORT_INTERVAL_HOURS
        value: "12"
      - key: LOW_STOCK_THRESHOLD
        value: "3"
    # להזמנות שנשמרות לתמיד (SQLite): שדרגו ל-plan: starter והסירו את ההערה —
    # בתוכנית free הדיסק זמני וההזמנות נמחקות בכל deploy.
    # disk:
    #   name: soleluna-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
